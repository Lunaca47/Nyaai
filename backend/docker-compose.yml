version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: nyaai
      POSTGRES_USER: nyaai
      POSTGRES_PASSWORD: nyaai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - AUTH_SECRET_KEY=dry_run_dev_secret_key_nyaai_2026_refactor
      - DATABASE_URL=postgresql+asyncpg://nyaai:nyaai@postgres:5432/nyaai
      - QDRANT_URL=http://qdrant:6333
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - ALLOW_IN_MEMORY_FALLBACK=True
    depends_on:
      - postgres
      - qdrant
      - minio

volumes:
  pgdata:
  qdrantdata:
  miniodata:

